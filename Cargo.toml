[package]
name = "ozone-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "ozone_rust"
path = "src/lib.rs"

[dependencies]
bytes = "1.10"
futures = "0.3"
prost = "0.13"
prost-types = "0.13"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "gzip"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["v4"] }

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"

[dev-dependencies]
hex = "0.4"
rand = "0.9"
tempfile = "3.20"
